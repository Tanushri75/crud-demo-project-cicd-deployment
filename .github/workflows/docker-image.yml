name: Docker Build -> Push -> Deploy 

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest  
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    - name: Build Jar
      run: mvn clean package -DskipTests

    - name: Login to Docker Hub
      run: docker login -u "{{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/crud-demo:latest .

    - name: Push Image to Docker Hub
      run: docker push ${{ secrets.DOCKER_USERNAME }}/crud-demo:latest

    - name: SSH and Deploy to EC2
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker stop crud-demo || true
          docker rm crud-demo || true
          docker pull ${{ secrets.DOCKER_USERNAME }}/crud-demo:latest
          docker run -d --name crud-demo -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/crud-demo:latest   
